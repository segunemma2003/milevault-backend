[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.celery"

[deploy]
startCommand = "celery -A app.services.celery_app worker -B --loglevel=info --concurrency=2 -Q default,media,notifications,kyc,payments --schedule /tmp/celerybeat-schedule"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
